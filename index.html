<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="./index.css
    ">
</head>
<body>
    <div class="container">
        <h1>Lista de Tareas</h1>
        <div class="counters">
            <div class="counter">
                <div class="counter-value counter-total">0</div>
                <div class="counter-label">Total</div>
            </div>
            <div class="counter">
                <div class="counter-value counter-incomplete">0</div>
                <div class="counter-label">Pendientes</div>
            </div>
            <div class="counter">
                <div class="counter-value counter-complete">0</div>
                <div class="counter-label">Completadas</div>
            </div>
        </div>
        <div class="search">
            <form>
                <input type="text" placeholder="Agregar tarea...">
                <button class="btn-add">+</button>
            </form>
        </div>
        <div class="li-container">
            <ul>
                
            </ul>
        </div>
        <div class="empty">
            <p>No tienes tareas pendientes.</p>
        </div>
    </div>
    <script src="./index.js" type="module"></script>
</body>
</html>
